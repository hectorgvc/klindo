<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenants | Superadmin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-[#0a0a0a] text-[#f5f5f5]">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#f97316] rounded-lg flex items-center justify-center">
          <i data-lucide="utensils" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <p class="font-display text-lg">Fast Orden</p>
          <p class="text-xs text-[#facc15]">Superadmin</p>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
      <a href="tenants.html" class="sidebar-link active">
        <i data-lucide="building-2"></i>
        <span>Tenants</span>
      </a>
      <a href="crear-tenant.html" class="sidebar-link">
        <i data-lucide="plus-circle"></i>
        <span>Nuevo Tenant</span>
      </a>
    </nav>

    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-[#2a2a2a]">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-8 h-8 bg-[#1f1f1f] rounded-full flex items-center justify-center">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p id="userName" class="text-sm font-medium truncate">Cargando...</p>
          <p class="text-xs text-[#facc15]">Superadmin</p>
        </div>
      </div>
      <button id="logoutBtn" class="btn btn-ghost w-full justify-start">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="font-display text-3xl">Tenants</h1>
        <p class="text-[#9ca3af]">Gestiona todos los negocios</p>
      </div>
      <div class="flex gap-3">
        <select id="filterPlan" class="form-input w-auto">
          <option value="">Todos los planes</option>
          <option value="basico">Básico</option>
          <option value="pro">Pro</option>
        </select>
        <a href="crear-tenant.html" class="btn btn-primary">
          <i data-lucide="plus" class="w-5 h-5"></i>
          <span>Nuevo Tenant</span>
        </a>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-[#1f1f1f]">
            <tr>
              <th class="text-left px-6 py-4 text-sm font-semibold text-[#9ca3af]">Negocio</th>
              <th class="text-left px-6 py-4 text-sm font-semibold text-[#9ca3af]">Plan</th>
              <th class="text-left px-6 py-4 text-sm font-semibold text-[#9ca3af]">Ciclo</th>
              <th class="text-left px-6 py-4 text-sm font-semibold text-[#9ca3af]">Vencimiento</th>
              <th class="text-left px-6 py-4 text-sm font-semibold text-[#9ca3af]">Estado</th>
              <th class="text-right px-6 py-4 text-sm font-semibold text-[#9ca3af]">Acciones</th>
            </tr>
          </thead>
          <tbody id="tenantsTable" class="divide-y divide-[#2a2a2a]">
            <tr>
              <td colspan="6" class="px-6 py-8 text-center text-[#9ca3af]">
                <div class="animate-pulse">Cargando tenants...</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Editar -->
  <div id="editModal" class="fixed inset-0 z-[200] hidden">
    <div class="absolute inset-0 bg-black/70" id="editModalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-[#141414] border border-[#2a2a2a] rounded-2xl max-w-md w-full">
        <div class="p-6 border-b border-[#2a2a2a]">
          <div class="flex items-center justify-between">
            <h2 class="font-display text-2xl">Editar Tenant</h2>
            <button id="closeEditModal" class="p-2 hover:bg-[#1f1f1f] rounded-lg">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <form id="editForm" class="p-6 space-y-5">
          <input type="hidden" id="editTenantId">

          <div>
            <label class="form-label">Nombre</label>
            <input type="text" id="editName" class="form-input" required>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="form-label">Plan</label>
              <select id="editPlan" class="form-input">
                <option value="basico">Básico</option>
                <option value="pro">Pro</option>
              </select>
            </div>
            <div>
              <label class="form-label">Ciclo</label>
              <select id="editCiclo" class="form-input">
                <option value="mensual">Mensual</option>
                <option value="anual">Anual</option>
              </select>
            </div>
          </div>

          <div>
            <label class="form-label">Fecha de Vencimiento</label>
            <input type="date" id="editExpiry" class="form-input">
          </div>

          <div class="flex items-center gap-3">
            <input type="checkbox" id="editActive" class="w-5 h-5 rounded border-[#2a2a2a] bg-[#1f1f1f] text-[#f97316]">
            <label for="editActive" class="text-sm">Tenant activo</label>
          </div>

          <div class="flex gap-3 pt-4">
            <button type="button" id="cancelEdit" class="btn btn-secondary flex-1">Cancelar</button>
            <button type="submit" class="btn btn-primary flex-1">Guardar Cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-[#22c55e] text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-[300] flex items-center gap-2">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toastMessage">Operación exitosa</span>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    lucide.createIcons();

    let profile = null;
    let allTenants = [];
    let editingTenantId = null;

    async function init() {
      profile = await window.auth.protectSuperadminRoute();
      if (!profile) return;

      document.getElementById('userName').textContent = profile.nombre;

      await loadTenants();

      lucide.createIcons();
    }

    async function loadTenants() {
      const { data, error } = await supabase
        .from('tenants')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error cargando tenants:', error);
        return;
      }

      allTenants = data || [];
      renderTenants();
    }

    function renderTenants() {
      const filterPlan = document.getElementById('filterPlan').value;
      let filtered = allTenants;

      if (filterPlan) {
        filtered = allTenants.filter(t => t.plan === filterPlan);
      }

      const tbody = document.getElementById('tenantsTable');

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="px-6 py-12 text-center text-[#9ca3af]">
              <i data-lucide="building-2" class="w-12 h-12 mx-auto mb-3 text-[#2a2a2a]"></i>
              <p>No hay tenants</p>
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = filtered.map(t => {
        const planVencido = t.plan_expira_at && new Date(t.plan_expira_at) < new Date();
        const planProximo = t.plan_expira_at && !planVencido &&
          (new Date(t.plan_expira_at) - new Date()) / (1000 * 60 * 60 * 24) <= 15;

        return `
          <tr class="hover:bg-[#1f1f1f] transition-colors">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                ${t.logo_url ? `
                  <img src="${t.logo_url}" alt="" class="w-10 h-10 object-cover rounded-lg">
                ` : `
                  <div class="w-10 h-10 bg-[#1f1f1f] rounded-lg flex items-center justify-center">
                    <i data-lucide="store" class="w-5 h-5 text-[#4a4a4a]"></i>
                  </div>
                `}
                <div>
                  <p class="font-medium">${t.nombre}</p>
                  <p class="text-sm text-[#9ca3af]">${t.slug}</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">
              <span class="text-xs px-2 py-1 rounded ${t.plan === 'pro' ? 'bg-[#facc15] text-black' : 'bg-[#3b82f6] text-white'}">${t.plan === 'pro' ? 'Pro' : 'Básico'}</span>
            </td>
            <td class="px-6 py-4">
              <span class="text-sm capitalize">${t.ciclo}</span>
            </td>
            <td class="px-6 py-4">
              ${t.plan_expira_at ? `
                <div class="flex items-center gap-2">
                  <span class="${planVencido ? 'text-[#ef4444]' : planProximo ? 'text-[#facc15]' : ''}">
                    ${new Date(t.plan_expira_at).toLocaleDateString('es-DO')}
                  </span>
                  ${planVencido ? '<span class="badge bg-[#ef4444]">Vencido</span>' : ''}
                  ${planProximo ? '<span class="badge bg-[#facc15] text-black">Pronto</span>' : ''}
                </div>
              ` : '-'}
            </td>
            <td class="px-6 py-4">
              <span class="text-xs px-2 py-1 rounded ${t.activo ? 'bg-[#22c55e]/20 text-[#22c55e]' : 'bg-[#ef4444]/20 text-[#ef4444]'}">${t.activo ? 'Activo' : 'Inactivo'}</span>
            </td>
            <td class="px-6 py-4 text-right">
              <div class="flex items-center justify-end gap-2">
                <a href="/menu.html?tenant=${t.slug}" target="_blank" class="p-2 hover:bg-[#1f1f1f] rounded-lg"
                  title="Ver menú">
                  <i data-lucide="external-link" class="w-4 h-4"></i>
                </a>
                <button onclick="openEditModal('${t.id}')" class="p-2 hover:bg-[#1f1f1f] rounded-lg"
                  title="Editar">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Filter
    document.getElementById('filterPlan').addEventListener('change', renderTenants);

    // Edit modal
    window.openEditModal = function(tenantId) {
      const tenant = allTenants.find(t => t.id === tenantId);
      if (!tenant) return;

      editingTenantId = tenantId;

      document.getElementById('editTenantId').value = tenantId;
      document.getElementById('editName').value = tenant.nombre;
      document.getElementById('editPlan').value = tenant.plan;
      document.getElementById('editCiclo').value = tenant.ciclo;
      document.getElementById('editActive').checked = tenant.activo;

      if (tenant.plan_expira_at) {
        document.getElementById('editExpiry').value = tenant.plan_expira_at.split('T')[0];
      } else {
        document.getElementById('editExpiry').value = '';
      }

      document.getElementById('editModal').classList.remove('hidden');
    };

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      editingTenantId = null;
    }

    document.getElementById('closeEditModal').addEventListener('click', closeEditModal);
    document.getElementById('editModalOverlay').addEventListener('click', closeEditModal);
    document.getElementById('cancelEdit').addEventListener('click', closeEditModal);

    // Save edit
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const updates = {
        nombre: document.getElementById('editName').value,
        plan: document.getElementById('editPlan').value,
        ciclo: document.getElementById('editCiclo').value,
        activo: document.getElementById('editActive').checked,
        plan_expira_at: document.getElementById('editExpiry').value || null
      };

      const { error } = await supabase
        .from('tenants')
        .update(updates)
        .eq('id', editingTenantId);

      if (error) {
        showToast('Error al actualizar', 'error');
        return;
      }

      showToast('Tenant actualizado');
      closeEditModal();
      await loadTenants();
    });

    // Toast
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');

      toastMessage.textContent = message;
      toast.className = `fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg transform transition-all duration-300 z-[300] flex items-center gap-2 ${
        type === 'success' ? 'bg-[#22c55e] text-white' : 'bg-[#ef4444] text-white'
      }`;

      toast.classList.remove('translate-y-20', 'opacity-0');

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', window.auth.logout);

    // Iniciar
    init();
  </script>
</body>
</html>
