<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentas Bancarias | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-[#0a0a0a] text-[#f5f5f5]">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#f97316] rounded-lg flex items-center justify-center">
          <i data-lucide="utensils" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <p class="font-display text-lg">Fast Orden</p>
          <p class="text-xs text-[#9ca3af]">Admin Portal</p>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
      <a href="productos.html" class="sidebar-link">
        <i data-lucide="package"></i>
        <span>Productos</span>
      </a>
      <a href="categorias.html" class="sidebar-link">
        <i data-lucide="tags"></i>
        <span>Categorías</span>
      </a>
      <a href="ofertas.html" class="sidebar-link">
        <i data-lucide="tag"></i>
        <span>Ofertas</span>
      </a>
      <a href="cuentas.html" class="sidebar-link active">
        <i data-lucide="building-2"></i>
        <span>Cuentas Bancarias</span>
      </a>
      <a href="configuracion.html" class="sidebar-link">
        <i data-lucide="settings"></i>
        <span>Configuración</span>
      </a>
    </nav>

    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-[#2a2a2a]">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-8 h-8 bg-[#1f1f1f] rounded-full flex items-center justify-center">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p id="userName" class="text-sm font-medium truncate">Cargando...</p>
        </div>
      </div>
      <button id="logoutBtn" class="btn btn-ghost w-full justify-start">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="font-display text-3xl">Cuentas Bancarias</h1>
        <p class="text-[#9ca3af]">Gestiona tus métodos de pago</p>
      </div>
      <button id="addBtn" class="btn btn-primary">
        <i data-lucide="plus" class="w-5 h-5"></i>
        <span>Agregar Cuenta</span>
      </button>
    </div>

    <!-- Grid de Cuentas -->
    <div id="cuentasGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- Skeleton -->
      <div class="skeleton h-40 rounded-xl"></div>
      <div class="skeleton h-40 rounded-xl"></div>
    </div>

    <!-- Estado vacío -->
    <div id="emptyState" class="hidden text-center py-16">
      <i data-lucide="building-2" class="w-16 h-16 mx-auto text-[#2a2a2a] mb-4"></i>
      <p class="text-[#9ca3af] mb-4">No hay cuentas bancarias registradas</p>
      <button onclick="openModal()" class="btn btn-primary btn-sm">Agregar primera cuenta</button>
    </div>
  </main>

  <!-- Modal -->
  <div id="cuentaModal" class="fixed inset-0 z-[200] hidden">
    <div class="absolute inset-0 bg-black/70" id="modalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-[#141414] border border-[#2a2a2a] rounded-2xl max-w-md w-full">
        <div class="p-6 border-b border-[#2a2a2a]">
          <div class="flex items-center justify-between">
            <h2 id="modalTitle" class="font-display text-2xl">Nueva Cuenta</h2>
            <button id="closeModal" class="p-2 hover:bg-[#1f1f1f] rounded-lg">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <form id="cuentaForm" class="p-6 space-y-5">
          <input type="hidden" id="cuentaId">

          <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2">
              <label class="form-label">Banco *</label>
              <input type="text" id="bankName" required class="form-input" placeholder="Ej: Banco Popular">
            </div>

            <div class="col-span-2">
              <label class="form-label">Número de Cuenta *</label>
              <input type="text" id="accountNumber" required class="form-input" placeholder="000000000000">
            </div>

            <div>
              <label class="form-label">Titular *</label>
              <input type="text" id="accountHolder" required class="form-input" placeholder="Nombre completo">
            </div>

            <div>
              <label class="form-label">Tipo de Cuenta</label>
              <select id="accountType" class="form-input">
                <option value="">Seleccionar</option>
                <option value="Ahorro">Ahorro</option>
                <option value="Corriente">Corriente</option>
              </select>
            </div>

            <div>
              <label class="form-label">Orden</label>
              <input type="number" id="accountOrder" class="form-input" placeholder="0" min="0">
            </div>

            <div class="flex items-center gap-3">
              <label class="form-label">Activa</label>
              <input type="checkbox" id="accountActive" class="w-5 h-5 rounded border-[#2a2a2a] bg-[#1f1f1f] text-[#f97316]" checked>
            </div>
          </div>

          <div class="flex gap-3 pt-4">
            <button type="button" id="cancelBtn" class="btn btn-secondary flex-1">Cancelar</button>
            <button type="submit" id="saveBtn" class="btn btn-primary flex-1">
              <span id="saveBtnText">Guardar</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Eliminar -->
  <div id="deleteModal" class="fixed inset-0 z-[200] hidden">
    <div class="absolute inset-0 bg-black/70" id="deleteModalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-[#141414] border border-[#2a2a2a] rounded-2xl max-w-sm w-full p-6">
        <div class="text-center">
          <div class="w-16 h-16 bg-[#ef4444]/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="trash-2" class="w-8 h-8 text-[#ef4444]"></i>
          </div>
          <h3 class="font-display text-xl mb-2">¿Eliminar cuenta?</h3>
          <p class="text-[#9ca3af] mb-6">Esta acción no se puede deshacer.</p>
          <div class="flex gap-3">
            <button id="cancelDelete" class="btn btn-secondary flex-1">Cancelar</button>
            <button id="confirmDelete" class="btn bg-[#ef4444] hover:bg-[#dc2626] text-white flex-1">Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-[#22c55e] text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-[300] flex items-center gap-2">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toastMessage">Operación exitosa</span>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    lucide.createIcons();

    let tenantId = null;
    let cuentas = [];
    let editingId = null;
    let deletingId = null;

    async function init() {
      const profile = await window.auth.protectAdminRoute();
      if (!profile) return;

      document.getElementById('userName').textContent = profile.nombre;
      tenantId = sessionStorage.getItem('tenant_id');

      await loadCuentas();
      lucide.createIcons();
    }

    async function loadCuentas() {
      const { data, error } = await supabase
        .from('cuentas_bancarias')
        .select('*')
        .eq('tenant_id', tenantId)
        .order('orden');

      if (error) {
        console.error('Error cargando cuentas:', error);
        return;
      }

      cuentas = data || [];
      renderCuentas();
    }

    function renderCuentas() {
      const container = document.getElementById('cuentasGrid');
      const emptyState = document.getElementById('emptyState');

      if (cuentas.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      container.innerHTML = cuentas.map(cuenta => `
        <div class="card p-6 ${!cuenta.activa ? 'opacity-50' : ''}">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-[#22c55e]/20 rounded-xl flex items-center justify-center">
                <i data-lucide="building-2" class="w-6 h-6 text-[#22c55e]"></i>
              </div>
              <div>
                <h3 class="font-semibold text-lg">${cuenta.banco}</h3>
                ${cuenta.tipo_cuenta ? `<span class="text-xs bg-[#1f1f1f] px-2 py-1 rounded">${cuenta.tipo_cuenta}</span>` : ''}
                ${!cuenta.activa ? '<span class="text-xs text-[#ef4444]">Inactiva</span>' : ''}
              </div>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="toggleActiva('${cuenta.id}', ${!cuenta.activa})" class="p-2 hover:bg-[#1f1f1f] rounded-lg"
                title="${cuenta.activa ? 'Desactivar' : 'Activar'}">
                <i data-lucide="${cuenta.activa ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>
              </button>
              <button onclick="editCuenta('${cuenta.id}')" class="p-2 hover:bg-[#1f1f1f] rounded-lg">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button onclick="confirmDelete('${cuenta.id}')" class="p-2 hover:bg-[#ef4444]/20 rounded-lg">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="mt-4 pt-4 border-t border-[#2a2a2a] space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-sm text-[#9ca3af]">Número:</span>
              <span class="font-mono">${cuenta.numero}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-sm text-[#9ca3af]">Titular:</span>
              <span>${cuenta.titular}</span>
            </div>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // Toggle activa
    window.toggleActiva = async function(id, activa) {
      const { error } = await supabase
        .from('cuentas_bancarias')
        .update({ activa })
        .eq('id', id)
        .eq('tenant_id', tenantId);

      if (error) {
        showToast('Error al actualizar', 'error');
        return;
      }

      await loadCuentas();
      showToast(activa ? 'Cuenta activada' : 'Cuenta desactivada');
    };

    // Modal functions
    function openModal(cuenta = null) {
      editingId = cuenta?.id || null;

      document.getElementById('modalTitle').textContent = cuenta ? 'Editar Cuenta' : 'Nueva Cuenta';
      document.getElementById('saveBtnText').textContent = cuenta ? 'Actualizar' : 'Guardar';

      document.getElementById('cuentaForm').reset();

      if (cuenta) {
        document.getElementById('bankName').value = cuenta.banco;
        document.getElementById('accountNumber').value = cuenta.numero;
        document.getElementById('accountHolder').value = cuenta.titular;
        document.getElementById('accountType').value = cuenta.tipo_cuenta || '';
        document.getElementById('accountOrder').value = cuenta.orden || 0;
        document.getElementById('accountActive').checked = cuenta.activa;
      }

      document.getElementById('cuentaModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('cuentaModal').classList.add('hidden');
      editingId = null;
    }

    // Event listeners
    document.getElementById('addBtn').addEventListener('click', () => openModal());
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    // Guardar
    document.getElementById('cuentaForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const cuentaData = {
        tenant_id: tenantId,
        banco: document.getElementById('bankName').value,
        numero: document.getElementById('accountNumber').value,
        titular: document.getElementById('accountHolder').value,
        tipo_cuenta: document.getElementById('accountType').value || null,
        orden: parseInt(document.getElementById('accountOrder').value) || 0,
        activa: document.getElementById('accountActive').checked
      };

      document.getElementById('saveBtn').disabled = true;
      document.getElementById('saveBtnText').textContent = 'Guardando...';

      try {
        if (editingId) {
          const { error } = await supabase
            .from('cuentas_bancarias')
            .update(cuentaData)
            .eq('id', editingId)
            .eq('tenant_id', tenantId);

          if (error) throw error;
          showToast('Cuenta actualizada');
        } else {
          const { error } = await supabase
            .from('cuentas_bancarias')
            .insert(cuentaData);

          if (error) throw error;
          showToast('Cuenta creada');
        }

        closeModal();
        await loadCuentas();
      } catch (error) {
        console.error('Error:', error);
        showToast('Error al guardar', 'error');
      } finally {
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtnText').textContent = editingId ? 'Actualizar' : 'Guardar';
      }
    });

    // Editar
    window.editCuenta = function(id) {
      const cuenta = cuentas.find(c => c.id === id);
      if (cuenta) openModal(cuenta);
    };

    // Eliminar
    window.confirmDelete = function(id) {
      deletingId = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    };

    document.getElementById('cancelDelete').addEventListener('click', () => {
      deletingId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    });

    document.getElementById('deleteModalOverlay').addEventListener('click', () => {
      deletingId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    });

    document.getElementById('confirmDelete').addEventListener('click', async () => {
      if (!deletingId) return;

      const { error } = await supabase
        .from('cuentas_bancarias')
        .delete()
        .eq('id', deletingId)
        .eq('tenant_id', tenantId);

      if (error) {
        showToast('Error al eliminar', 'error');
        return;
      }

      showToast('Cuenta eliminada');
      deletingId = null;
      document.getElementById('deleteModal').classList.add('hidden');
      await loadCuentas();
    });

    // Toast
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');

      toastMessage.textContent = message;
      toast.className = `fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg transform transition-all duration-300 z-[300] flex items-center gap-2 ${
        type === 'success' ? 'bg-[#22c55e] text-white' : 'bg-[#ef4444] text-white'
      }`;

      toast.classList.remove('translate-y-20', 'opacity-0');

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', window.auth.logout);

    // Iniciar
    init();
  </script>
</body>
</html>
