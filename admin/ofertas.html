<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofertas | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-[#0a0a0a] text-[#f5f5f5]">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#f97316] rounded-lg flex items-center justify-center">
          <i data-lucide="utensils" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <p class="font-display text-lg">Fast Orden</p>
          <p class="text-xs text-[#9ca3af]">Admin Portal</p>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
      <a href="productos.html" class="sidebar-link">
        <i data-lucide="package"></i>
        <span>Productos</span>
      </a>
      <a href="categorias.html" class="sidebar-link">
        <i data-lucide="tags"></i>
        <span>Categorías</span>
      </a>
      <a href="ofertas.html" class="sidebar-link active">
        <i data-lucide="tag"></i>
        <span>Ofertas</span>
      </a>
      <a href="cuentas.html" class="sidebar-link">
        <i data-lucide="building-2"></i>
        <span>Cuentas Bancarias</span>
      </a>
      <a href="configuracion.html" class="sidebar-link">
        <i data-lucide="settings"></i>
        <span>Configuración</span>
      </a>
    </nav>

    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-[#2a2a2a]">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-8 h-8 bg-[#1f1f1f] rounded-full flex items-center justify-center">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p id="userName" class="text-sm font-medium truncate">Cargando...</p>
        </div>
      </div>
      <button id="logoutBtn" class="btn btn-ghost w-full justify-start">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="font-display text-3xl">Ofertas</h1>
        <p class="text-[#9ca3af]">Gestiona promociones y combos</p>
      </div>
      <button id="addBtn" class="btn btn-primary">
        <i data-lucide="plus" class="w-5 h-5"></i>
        <span>Nueva Oferta</span>
      </button>
    </div>

    <!-- Grid de Ofertas -->
    <div id="ofertasGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Skeleton -->
      <div class="skeleton h-48 rounded-xl"></div>
      <div class="skeleton h-48 rounded-xl"></div>
      <div class="skeleton h-48 rounded-xl"></div>
    </div>

    <!-- Estado vacío -->
    <div id="emptyState" class="hidden text-center py-16">
      <i data-lucide="tag" class="w-16 h-16 mx-auto text-[#2a2a2a] mb-4"></i>
      <p class="text-[#9ca3af] mb-4">No hay ofertas creadas</p>
      <button onclick="openModal()" class="btn btn-primary btn-sm">Crear primera oferta</button>
    </div>
  </main>

  <!-- Modal -->
  <div id="ofertaModal" class="fixed inset-0 z-[200] hidden">
    <div class="absolute inset-0 bg-black/70" id="modalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4 overflow-y-auto">
      <div class="bg-[#141414] border border-[#2a2a2a] rounded-2xl max-w-lg w-full my-8">
        <div class="p-6 border-b border-[#2a2a2a]">
          <div class="flex items-center justify-between">
            <h2 id="modalTitle" class="font-display text-2xl">Nueva Oferta</h2>
            <button id="closeModal" class="p-2 hover:bg-[#1f1f1f] rounded-lg">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <form id="ofertaForm" class="p-6 space-y-5">
          <input type="hidden" id="ofertaId">

          <!-- Tipo de oferta -->
          <div>
            <label class="form-label">Tipo de Oferta *</label>
            <div class="grid grid-cols-2 gap-3">
              <label class="cursor-pointer">
                <input type="radio" name="tipo" value="descuento" class="sr-only" checked>
                <div class="tipo-option p-4 bg-[#1f1f1f] border-2 border-transparent rounded-xl text-center hover:border-[#f97316] transition-all">
                  <i data-lucide="percent" class="w-6 h-6 mx-auto mb-2"></i>
                  <p class="font-medium">Descuento</p>
                  <p class="text-xs text-[#9ca3af]">En producto existente</p>
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="tipo" value="combo" class="sr-only">
                <div class="tipo-option p-4 bg-[#1f1f1f] border-2 border-transparent rounded-xl text-center hover:border-[#f97316] transition-all">
                  <i data-lucide="package-plus" class="w-6 h-6 mx-auto mb-2"></i>
                  <p class="font-medium">Combo</p>
                  <p class="text-xs text-[#9ca3af]">Especial personalizado</p>
                </div>
              </label>
            </div>
          </div>

          <!-- Nombre -->
          <div>
            <label class="form-label">Nombre de la Oferta *</label>
            <input type="text" id="ofertaNombre" required class="form-input" placeholder="Ej: Burger del Día">
          </div>

          <!-- Campos para Descuento -->
          <div id="descuentoFields">
            <div>
              <label class="form-label">Producto *</label>
              <select id="ofertaProducto" class="form-input">
                <option value="">Seleccionar producto...</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4">
              <div>
                <label class="form-label">Precio Original</label>
                <input type="number" id="precioOriginal" class="form-input" readonly>
              </div>
              <div>
                <label class="form-label">Precio de Oferta *</label>
                <input type="number" id="precioOferta" class="form-input" required min="0" step="0.01">
              </div>
            </div>

            <div id="ahorroPreview" class="hidden mt-2 p-3 bg-[#22c55e]/10 border border-[#22c55e] rounded-lg">
              <p class="text-sm text-[#22c55e]">
                <i data-lucide="check-circle" class="w-4 h-4 inline mr-1"></i>
                El cliente ahorra <span id="ahorroMonto"></span> (<span id="ahorroPorcentaje"></span>%)
              </p>
            </div>
          </div>

          <!-- Campos para Combo -->
          <div id="comboFields" class="hidden">
            <div>
              <label class="form-label">Contenido del Combo *</label>
              <textarea id="comboContenido" rows="2" class="form-input" placeholder="Ej: 2 Burgers + 2 Bebidas + 2 Papas"></textarea>
            </div>

            <div class="mt-4">
              <label class="form-label">Precio del Combo *</label>
              <input type="number" id="comboPrecio" class="form-input" min="0" step="0.01">
            </div>
          </div>

          <!-- Descripción (opcional) -->
          <div>
            <label class="form-label">Descripción</label>
            <textarea id="ofertaDescripcion" rows="2" class="form-input" placeholder="Descripción adicional..."></textarea>
          </div>

          <!-- Imagen -->
          <div>
            <label class="form-label">Imagen</label>
            <div id="imagePreview" class="hidden mb-3 w-full h-40 bg-[#1f1f1f] rounded-lg overflow-hidden">
              <img id="previewImg" src="" alt="Preview" class="w-full h-full object-cover">
            </div>
            <div class="flex gap-3">
              <input type="file" id="ofertaImage" accept="image/*" class="hidden">
              <button type="button" id="selectImageBtn" class="btn btn-secondary btn-sm">
                <i data-lucide="image-plus" class="w-4 h-4"></i>
                <span id="imgBtnText">Seleccionar imagen</span>
              </button>
              <button type="button" id="removeImageBtn" class="btn btn-ghost btn-sm text-[#ef4444] hidden">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Vigencia -->
          <div class="border-t border-[#2a2a2a] pt-5">
            <div class="flex items-center gap-3 mb-4">
              <input type="checkbox" id="siempreActiva" class="w-5 h-5 rounded border-[#2a2a2a] bg-[#1f1f1f] text-[#f97316]" checked>
              <label for="siempreActiva" class="text-sm font-medium">Siempre activa</label>
            </div>

            <div id="vigenciaFields" class="hidden space-y-4">
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="form-label">Fecha inicio</label>
                  <input type="date" id="fechaInicio" class="form-input">
                </div>
                <div>
                  <label class="form-label">Fecha fin</label>
                  <input type="date" id="fechaFin" class="form-input">
                </div>
              </div>

              <div>
                <label class="form-label">Días de la semana</label>
                <div class="flex flex-wrap gap-2 mt-2">
                  <label class="flex items-center gap-1 px-3 py-1 bg-[#1f1f1f] rounded-full cursor-pointer hover:bg-[#2a2a2a]">
                    <input type="checkbox" value="lunes" class="dia-semana rounded border-[#2a2a2a]">
                    <span class="text-sm">Lun</span>
                  </label>
                  <label class="flex items-center gap-1 px-3 py-1 bg-[#1f1f1f] rounded-full cursor-pointer hover:bg-[#2a2a2a]">
                    <input type="checkbox" value="martes" class="dia-semana rounded border-[#2a2a2a]">
                    <span class="text-sm">Mar</span>
                  </label>
                  <label class="flex items-center gap-1 px-3 py-1 bg-[#1f1f1f] rounded-full cursor-pointer hover:bg-[#2a2a2a]">
                    <input type="checkbox" value="miercoles" class="dia-semana rounded border-[#2a2a2a]">
                    <span class="text-sm">Mié</span>
                  </label>
                  <label class="flex items-center gap-1 px-3 py-1 bg-[#1f1f1f] rounded-full cursor-pointer hover:bg-[#2a2a2a]">
                    <input type="checkbox" value="jueves" class="dia-semana rounded border-[#2a2a2a]">
                    <span class="text-sm">Jue</span>
                  </label>
                  <label class="flex items-center gap-1 px-3 py-1 bg-[#1f1f1f] rounded-full cursor-pointer hover:bg-[#2a2a2a]">
                    <input type="checkbox" value="viernes" class="dia-semana rounded border-[#2a2a2a]">
                    <span class="text-sm">Vie</span>
                  </label>
                  <label class="flex items-center gap-1 px-3 py-1 bg-[#1f1f1f] rounded-full cursor-pointer hover:bg-[#2a2a2a]">
                    <input type="checkbox" value="sabado" class="dia-semana rounded border-[#2a2a2a]">
                    <span class="text-sm">Sáb</span>
                  </label>
                  <label class="flex items-center gap-1 px-3 py-1 bg-[#1f1f1f] rounded-full cursor-pointer hover:bg-[#2a2a2a]">
                    <input type="checkbox" value="domingo" class="dia-semana rounded border-[#2a2a2a]">
                    <span class="text-sm">Dom</span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Activa -->
          <div class="flex items-center gap-3">
            <input type="checkbox" id="ofertaActiva" class="w-5 h-5 rounded border-[#2a2a2a] bg-[#1f1f1f] text-[#f97316]" checked>
            <label for="ofertaActiva" class="text-sm">Oferta activa</label>
          </div>

          <div class="flex gap-3 pt-4">
            <button type="button" id="cancelBtn" class="btn btn-secondary flex-1">Cancelar</button>
            <button type="submit" id="saveBtn" class="btn btn-primary flex-1">
              <span id="saveBtnText">Guardar</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Eliminar -->
  <div id="deleteModal" class="fixed inset-0 z-[200] hidden">
    <div class="absolute inset-0 bg-black/70" id="deleteModalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-[#141414] border border-[#2a2a2a] rounded-2xl max-w-sm w-full p-6">
        <div class="text-center">
          <div class="w-16 h-16 bg-[#ef4444]/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="trash-2" class="w-8 h-8 text-[#ef4444]"></i>
          </div>
          <h3 class="font-display text-xl mb-2">¿Eliminar oferta?</h3>
          <p class="text-[#9ca3af] mb-6">Esta acción no se puede deshacer.</p>
          <div class="flex gap-3">
            <button id="cancelDelete" class="btn btn-secondary flex-1">Cancelar</button>
            <button id="confirmDelete" class="btn bg-[#ef4444] hover:bg-[#dc2626] text-white flex-1">Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-[#22c55e] text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-[300] flex items-center gap-2">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toastMessage">Operación exitosa</span>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    const window.supabaseClient = window.window.supabaseClient;
    lucide.createIcons();

    let tenantId = null;
    let currentTenant = null;
    let ofertas = [];
    let productos = [];
    let editingId = null;
    let deletingId = null;
    let selectedImage = null;
    let currentImageUrl = null;

    async function init() {
      const profile = await window.auth.protectAdminRoute();
      if (!profile) return;

      document.getElementById('userName').textContent = profile.nombre;
      tenantId = sessionStorage.getItem('tenant_id');
      currentTenant = profile.tenants;

      await loadProductos();
      await loadOfertas();

      lucide.createIcons();
    }

    async function loadProductos() {
      const { data, error } = await supabase
        .from('productos')
        .select('id, nombre, precio')
        .eq('tenant_id', tenantId)
        .eq('disponible', true)
        .order('nombre');

      if (error) {
        console.error('Error cargando productos:', error);
        return;
      }

      productos = data || [];

      // Poblar selector
      const select = document.getElementById('ofertaProducto');
      select.innerHTML = '<option value="">Seleccionar producto...</option>' +
        productos.map(p => `<option value="${p.id}" data-precio="${p.precio}">${p.nombre} - ${currentTenant?.moneda || 'RD$'}${p.precio.toFixed(2)}</option>`).join('');
    }

    async function loadOfertas() {
      const { data, error } = await supabase
        .from('ofertas')
        .select('*')
        .eq('tenant_id', tenantId)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error cargando ofertas:', error);
        return;
      }

      ofertas = data || [];
      renderOfertas();
    }

    function ofertaEstaActiva(oferta) {
      if (!oferta.activa) return false;
      if (oferta.siempre_activa) return true;

      const hoy = new Date();
      const diasSemana = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
      const diaHoy = diasSemana[hoy.getDay()];

      if (oferta.fecha_inicio && oferta.fecha_fin) {
        const inicio = new Date(oferta.fecha_inicio);
        const fin = new Date(oferta.fecha_fin);
        fin.setHours(23, 59, 59);
        if (hoy < inicio || hoy > fin) return false;
      }

      if (oferta.dias_semana && oferta.dias_semana.length > 0) {
        if (!oferta.dias_semana.includes(diaHoy)) return false;
      }

      return true;
    }

    function formatearVigencia(oferta) {
      if (oferta.siempre_activa) return 'Siempre activa';

      let texto = '';
      if (oferta.fecha_inicio && oferta.fecha_fin) {
        const inicio = new Date(oferta.fecha_inicio).toLocaleDateString('es-DO');
        const fin = new Date(oferta.fecha_fin).toLocaleDateString('es-DO');
        texto = `${inicio} - ${fin}`;
      }

      if (oferta.dias_semana && oferta.dias_semana.length > 0) {
        const diasCortos = {
          'lunes': 'Lun', 'martes': 'Mar', 'miercoles': 'Mié',
          'jueves': 'Jue', 'viernes': 'Vie', 'sabado': 'Sáb', 'domingo': 'Dom'
        };
        texto += texto ? ' • ' : '';
        texto += oferta.dias_semana.map(d => diasCortos[d]).join(', ');
      }

      return texto || 'Sin restricciones';
    }

    function renderOfertas() {
      const container = document.getElementById('ofertasGrid');
      const emptyState = document.getElementById('emptyState');

      if (ofertas.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      container.innerHTML = ofertas.map(oferta => {
        const activa = ofertaEstaActiva(oferta);
        const isCombo = oferta.tipo === 'combo';

        return `
          <div class="card overflow-hidden ${!activa ? 'opacity-50' : ''}">
            <div class="relative">
              ${oferta.imagen_url ? `
                <img src="${oferta.imagen_url}" alt="" class="w-full h-40 object-cover">
              ` : `
                <div class="w-full h-40 bg-gradient-to-br from-[#f97316] to-[#dc2626] flex items-center justify-center">
                  <i data-lucide="${isCombo ? 'package-plus' : 'percent'}" class="w-12 h-12 text-white"></i>
                </div>
              `}
              <span class="absolute top-2 right-2 badge bg-[#ef4444]">${oferta.tipo === 'descuento' ? 'DESCUENTO' : 'COMBO'}</span>
              ${!activa ? '<span class="absolute top-2 left-2 badge bg-[#6b7280]">INACTIVA</span>' : ''}
            </div>
            <div class="p-4">
              <h3 class="font-semibold text-lg mb-1">${oferta.nombre}</h3>
              ${oferta.descripcion ? `<p class="text-sm text-[#9ca3af] mb-2">${oferta.descripcion}</p>` : ''}

              ${isCombo ? `
                <p class="text-sm text-[#9ca3af] mb-2">${oferta.contenido_combo}</p>
                <p class="font-display text-2xl text-[#f97316]">${currentTenant?.moneda || 'RD$'}${oferta.precio_oferta.toFixed(2)}</p>
              ` : `
                <div class="flex items-center gap-2 mb-2">
                  <span class="text-sm text-[#9ca3af] line-through">${currentTenant?.moneda || 'RD$'}${oferta.precio_original?.toFixed(2)}</span>
                  <span class="badge bg-[#22c55e]">-${Math.round((1 - oferta.precio_oferta / oferta.precio_original) * 100)}%</span>
                </div>
                <p class="font-display text-2xl text-[#f97316]">${currentTenant?.moneda || 'RD$'}${oferta.precio_oferta.toFixed(2)}</p>
              `}

              <div class="mt-3 pt-3 border-t border-[#2a2a2a] flex items-center justify-between">
                <span class="text-xs text-[#9ca3af]">${formatearVigencia(oferta)}</span>
                <div class="flex items-center gap-1">
                  <button onclick="toggleActiva('${oferta.id}', ${!oferta.activa})" class="p-2 hover:bg-[#1f1f1f] rounded-lg" title="${oferta.activa ? 'Desactivar' : 'Activar'}">
                    <i data-lucide="${oferta.activa ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>
                  </button>
                  <button onclick="editOferta('${oferta.id}')" class="p-2 hover:bg-[#1f1f1f] rounded-lg">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                  </button>
                  <button onclick="confirmDelete('${oferta.id}')" class="p-2 hover:bg-[#ef4444]/20 rounded-lg">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Toggle activa
    window.toggleActiva = async function(id, activa) {
      const { error } = await supabase
        .from('ofertas')
        .update({ activa })
        .eq('id', id)
        .eq('tenant_id', tenantId);

      if (error) {
        showToast('Error al actualizar', 'error');
        return;
      }

      await loadOfertas();
      showToast(activa ? 'Oferta activada' : 'Oferta desactivada');
    };

    // Modal functions
    function openModal(oferta = null) {
      editingId = oferta?.id || null;
      selectedImage = null;
      currentImageUrl = oferta?.imagen_url || null;

      document.getElementById('modalTitle').textContent = oferta ? 'Editar Oferta' : 'Nueva Oferta';
      document.getElementById('saveBtnText').textContent = oferta ? 'Actualizar' : 'Guardar';

      // Reset form
      document.getElementById('ofertaForm').reset();
      document.getElementById('ahorroPreview').classList.add('hidden');
      document.getElementById('imagePreview').classList.add('hidden');
      document.getElementById('removeImageBtn').classList.add('hidden');
      document.getElementById('imgBtnText').textContent = 'Seleccionar imagen';

      // Tipo por defecto
      document.querySelector('input[name="tipo"][value="descuento"]').checked = true;
      toggleTipoFields('descuento');

      if (oferta) {
        document.getElementById('ofertaNombre').value = oferta.nombre;
        document.getElementById('ofertaDescripcion').value = oferta.descripcion || '';
        document.getElementById('ofertaActiva').checked = oferta.activa;
        document.getElementById('siempreActiva').checked = oferta.siempre_activa;

        // Tipo
        document.querySelector(`input[name="tipo"][value="${oferta.tipo}"]`).checked = true;
        toggleTipoFields(oferta.tipo);

        if (oferta.tipo === 'descuento') {
          document.getElementById('ofertaProducto').value = oferta.producto_id || '';
          document.getElementById('precioOriginal').value = oferta.precio_original || '';
          document.getElementById('precioOferta').value = oferta.precio_oferta;
          updateAhorroPreview();
        } else {
          document.getElementById('comboContenido').value = oferta.contenido_combo || '';
          document.getElementById('comboPrecio').value = oferta.precio_oferta;
        }

        // Vigencia
        if (oferta.fecha_inicio) {
          document.getElementById('fechaInicio').value = oferta.fecha_inicio.split('T')[0];
        }
        if (oferta.fecha_fin) {
          document.getElementById('fechaFin').value = oferta.fecha_fin.split('T')[0];
        }

        if (oferta.dias_semana) {
          document.querySelectorAll('.dia-semana').forEach(cb => {
            cb.checked = oferta.dias_semana.includes(cb.value);
          });
        }

        // Imagen
        if (oferta.imagen_url) {
          document.getElementById('previewImg').src = oferta.imagen_url;
          document.getElementById('imagePreview').classList.remove('hidden');
          document.getElementById('removeImageBtn').classList.remove('hidden');
          document.getElementById('imgBtnText').textContent = 'Cambiar imagen';
        }

        toggleVigenciaFields(!oferta.siempre_activa);
      } else {
        document.getElementById('siempreActiva').checked = true;
        toggleVigenciaFields(false);
      }

      document.getElementById('ofertaModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('ofertaModal').classList.add('hidden');
      editingId = null;
      selectedImage = null;
      currentImageUrl = null;
    }

    function toggleTipoFields(tipo) {
      if (tipo === 'descuento') {
        document.getElementById('descuentoFields').classList.remove('hidden');
        document.getElementById('comboFields').classList.add('hidden');
      } else {
        document.getElementById('descuentoFields').classList.add('hidden');
        document.getElementById('comboFields').classList.remove('hidden');
      }
    }

    function toggleVigenciaFields(show) {
      if (show) {
        document.getElementById('vigenciaFields').classList.remove('hidden');
      } else {
        document.getElementById('vigenciaFields').classList.add('hidden');
      }
    }

    function updateAhorroPreview() {
      const original = parseFloat(document.getElementById('precioOriginal').value) || 0;
      const oferta = parseFloat(document.getElementById('precioOferta').value) || 0;

      if (original > 0 && oferta > 0 && oferta < original) {
        const ahorro = original - oferta;
        const porcentaje = Math.round((ahorro / original) * 100);
        document.getElementById('ahorroMonto').textContent = `${currentTenant?.moneda || 'RD$'}${ahorro.toFixed(2)}`;
        document.getElementById('ahorroPorcentaje').textContent = porcentaje;
        document.getElementById('ahorroPreview').classList.remove('hidden');
      } else {
        document.getElementById('ahorroPreview').classList.add('hidden');
      }
    }

    // Event listeners
    document.getElementById('addBtn').addEventListener('click', () => openModal());
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    // Cambio de tipo
    document.querySelectorAll('input[name="tipo"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        toggleTipoFields(e.target.value);
        // Actualizar estilos
        document.querySelectorAll('.tipo-option').forEach(el => el.classList.remove('border-[#f97316]'));
        e.target.nextElementSibling.classList.add('border-[#f97316]');
      });
    });

    // Siempre activa toggle
    document.getElementById('siempreActiva').addEventListener('change', (e) => {
      toggleVigenciaFields(!e.target.checked);
    });

    // Producto seleccionado - autocompletar precio
    document.getElementById('ofertaProducto').addEventListener('change', (e) => {
      const option = e.target.selectedOptions[0];
      if (option && option.dataset.precio) {
        document.getElementById('precioOriginal').value = option.dataset.precio;
        updateAhorroPreview();
      }
    });

    // Preview ahorro
    document.getElementById('precioOferta').addEventListener('input', updateAhorroPreview);

    // Image upload
    document.getElementById('selectImageBtn').addEventListener('click', () => {
      document.getElementById('ofertaImage').click();
    });

    document.getElementById('ofertaImage').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        selectedImage = file;
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('previewImg').src = e.target.result;
          document.getElementById('imagePreview').classList.remove('hidden');
          document.getElementById('removeImageBtn').classList.remove('hidden');
          document.getElementById('imgBtnText').textContent = 'Cambiar imagen';
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('removeImageBtn').addEventListener('click', () => {
      selectedImage = null;
      currentImageUrl = null;
      document.getElementById('ofertaImage').value = '';
      document.getElementById('imagePreview').classList.add('hidden');
      document.getElementById('removeImageBtn').classList.add('hidden');
      document.getElementById('imgBtnText').textContent = 'Seleccionar imagen';
    });

    // Guardar
    document.getElementById('ofertaForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const tipo = document.querySelector('input[name="tipo"]:checked').value;
      const nombre = document.getElementById('ofertaNombre').value;
      const descripcion = document.getElementById('ofertaDescripcion').value;
      const siempreActiva = document.getElementById('siempreActiva').checked;
      const activa = document.getElementById('ofertaActiva').checked;

      let ofertaData = {
        tenant_id: tenantId,
        tipo,
        nombre,
        descripcion,
        siempre_activa: siempreActiva,
        activa
      };

      if (tipo === 'descuento') {
        ofertaData.producto_id = document.getElementById('ofertaProducto').value || null;
        ofertaData.precio_original = parseFloat(document.getElementById('precioOriginal').value) || 0;
        ofertaData.precio_oferta = parseFloat(document.getElementById('precioOferta').value) || 0;
        ofertaData.contenido_combo = null;
      } else {
        ofertaData.producto_id = null;
        ofertaData.precio_original = null;
        ofertaData.precio_oferta = parseFloat(document.getElementById('comboPrecio').value) || 0;
        ofertaData.contenido_combo = document.getElementById('comboContenido').value;
      }

      if (!siempreActiva) {
        ofertaData.fecha_inicio = document.getElementById('fechaInicio').value || null;
        ofertaData.fecha_fin = document.getElementById('fechaFin').value || null;

        const diasSeleccionados = Array.from(document.querySelectorAll('.dia-semana:checked')).map(cb => cb.value);
        ofertaData.dias_semana = diasSeleccionados.length > 0 ? diasSeleccionados : null;
      } else {
        ofertaData.fecha_inicio = null;
        ofertaData.fecha_fin = null;
        ofertaData.dias_semana = null;
      }

      document.getElementById('saveBtn').disabled = true;
      document.getElementById('saveBtnText').textContent = 'Guardando...';

      try {
        // Subir imagen si hay una nueva
        if (selectedImage) {
          const fileExt = selectedImage.name.split('.').pop();
          const fileName = `oferta-${Date.now()}.${fileExt}`;
          const filePath = `${tenantId}/ofertas/${fileName}`;

          const { error: uploadError } = await window.supabaseClient.storage
            .from('tenant-assets')
            .upload(filePath, selectedImage);

          if (uploadError) throw uploadError;

          const { data: { publicUrl } } = window.supabaseClient.storage
            .from('tenant-assets')
            .getPublicUrl(filePath);

          ofertaData.imagen_url = publicUrl;
        } else if (currentImageUrl) {
          ofertaData.imagen_url = currentImageUrl;
        }

        if (editingId) {
          const { error } = await supabase
            .from('ofertas')
            .update(ofertaData)
            .eq('id', editingId)
            .eq('tenant_id', tenantId);

          if (error) throw error;
          showToast('Oferta actualizada');
        } else {
          const { error } = await supabase
            .from('ofertas')
            .insert(ofertaData);

          if (error) throw error;
          showToast('Oferta creada');
        }

        closeModal();
        await loadOfertas();
      } catch (error) {
        console.error('Error:', error);
        showToast('Error al guardar', 'error');
      } finally {
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtnText').textContent = editingId ? 'Actualizar' : 'Guardar';
      }
    });

    // Editar
    window.editOferta = function(id) {
      const oferta = ofertas.find(o => o.id === id);
      if (oferta) openModal(oferta);
    };

    // Eliminar
    window.confirmDelete = function(id) {
      deletingId = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    };

    document.getElementById('cancelDelete').addEventListener('click', () => {
      deletingId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    });

    document.getElementById('deleteModalOverlay').addEventListener('click', () => {
      deletingId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    });

    document.getElementById('confirmDelete').addEventListener('click', async () => {
      if (!deletingId) return;

      const { error } = await supabase
        .from('ofertas')
        .delete()
        .eq('id', deletingId)
        .eq('tenant_id', tenantId);

      if (error) {
        showToast('Error al eliminar', 'error');
        return;
      }

      showToast('Oferta eliminada');
      deletingId = null;
      document.getElementById('deleteModal').classList.add('hidden');
      await loadOfertas();
    });

    // Toast
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');

      toastMessage.textContent = message;
      toast.className = `fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg transform transition-all duration-300 z-[300] flex items-center gap-2 ${
        type === 'success' ? 'bg-[#22c55e] text-white' : 'bg-[#ef4444] text-white'
      }`;

      toast.classList.remove('translate-y-20', 'opacity-0');

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', window.auth.logout);

    // Iniciar
    init();
  </script>
</body>
</html>
