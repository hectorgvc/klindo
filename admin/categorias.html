<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-[#0a0a0a] text-[#f5f5f5]">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#f97316] rounded-lg flex items-center justify-center">
          <i data-lucide="utensils" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <p class="font-display text-lg">Fast Orden</p>
          <p class="text-xs text-[#9ca3af]">Admin Portal</p>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
      <a href="productos.html" class="sidebar-link">
        <i data-lucide="package"></i>
        <span>Productos</span>
      </a>
      <a href="categorias.html" class="sidebar-link active">
        <i data-lucide="tags"></i>
        <span>Categorías</span>
      </a>
      <a href="ofertas.html" class="sidebar-link">
        <i data-lucide="tag"></i>
        <span>Ofertas</span>
      </a>
      <a href="cuentas.html" class="sidebar-link">
        <i data-lucide="building-2"></i>
        <span>Cuentas Bancarias</span>
      </a>
      <a href="configuracion.html" class="sidebar-link">
        <i data-lucide="settings"></i>
        <span>Configuración</span>
      </a>
    </nav>

    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-[#2a2a2a]">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-8 h-8 bg-[#1f1f1f] rounded-full flex items-center justify-center">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p id="userName" class="text-sm font-medium truncate">Cargando...</p>
        </div>
      </div>
      <button id="logoutBtn" class="btn btn-ghost w-full justify-start">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="font-display text-3xl">Categorías</h1>
        <p class="text-[#9ca3af]">Organiza tu menú</p>
      </div>
      <button id="addBtn" class="btn btn-primary">
        <i data-lucide="plus" class="w-5 h-5"></i>
        <span>Nueva Categoría</span>
      </button>
    </div>

    <!-- Grid de Categorías -->
    <div id="categoriasGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Skeleton -->
      <div class="skeleton h-32 rounded-xl"></div>
      <div class="skeleton h-32 rounded-xl"></div>
      <div class="skeleton h-32 rounded-xl"></div>
    </div>

    <!-- Estado vacío -->
    <div id="emptyState" class="hidden text-center py-16">
      <i data-lucide="tags" class="w-16 h-16 mx-auto text-[#2a2a2a] mb-4"></i>
      <p class="text-[#9ca3af] mb-4">No hay categorías creadas</p>
      <button onclick="openModal()" class="btn btn-primary btn-sm">Crear primera categoría</button>
    </div>
  </main>

  <!-- Modal -->
  <div id="categoriaModal" class="fixed inset-0 z-[200] hidden">
    <div class="absolute inset-0 bg-black/70" id="modalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-[#141414] border border-[#2a2a2a] rounded-2xl max-w-md w-full">
        <div class="p-6 border-b border-[#2a2a2a]">
          <div class="flex items-center justify-between">
            <h2 id="modalTitle" class="font-display text-2xl">Nueva Categoría</h2>
            <button id="closeModal" class="p-2 hover:bg-[#1f1f1f] rounded-lg">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <form id="categoriaForm" class="p-6 space-y-5">
          <input type="hidden" id="categoriaId">

          <div>
            <label class="form-label">Nombre *</label>
            <input type="text" id="catName" required class="form-input" placeholder="Ej: Hamburguesas">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="form-label">Emoji</label>
              <input type="text" id="catEmoji" class="form-input text-center text-2xl" placeholder="🍔" maxlength="2">
            </div>
            <div>
              <label class="form-label">Orden</label>
              <input type="number" id="catOrder" class="form-input" placeholder="0" min="0">
            </div>
          </div>

          <div class="flex items-center gap-3">
            <input type="checkbox" id="catActive" class="w-5 h-5 rounded border-[#2a2a2a] bg-[#1f1f1f] text-[#f97316] focus:ring-[#f97316]" checked>
            <label for="catActive" class="text-sm">Categoría activa</label>
          </div>

          <div class="flex gap-3 pt-4">
            <button type="button" id="cancelBtn" class="btn btn-secondary flex-1">Cancelar</button>
            <button type="submit" id="saveBtn" class="btn btn-primary flex-1">
              <span id="saveBtnText">Guardar</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Eliminar -->
  <div id="deleteModal" class="fixed inset-0 z-[200] hidden">
    <div class="absolute inset-0 bg-black/70" id="deleteModalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-[#141414] border border-[#2a2a2a] rounded-2xl max-w-sm w-full p-6">
        <div class="text-center">
          <div class="w-16 h-16 bg-[#ef4444]/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="trash-2" class="w-8 h-8 text-[#ef4444]"></i>
          </div>
          <h3 class="font-display text-xl mb-2">¿Eliminar categoría?</h3>
          <p id="deleteWarning" class="text-[#9ca3af] mb-6">Esta acción no se puede deshacer.</p>
          <div class="flex gap-3">
            <button id="cancelDelete" class="btn btn-secondary flex-1">Cancelar</button>
            <button id="confirmDelete" class="btn bg-[#ef4444] hover:bg-[#dc2626] text-white flex-1">Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-[#22c55e] text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-[300] flex items-center gap-2">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toastMessage">Operación exitosa</span>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    lucide.createIcons();

    let tenantId = null;
    let categorias = [];
    let productos = [];
    let editingId = null;
    let deletingId = null;

    async function init() {
      const profile = await window.auth.protectAdminRoute();
      if (!profile) return;

      document.getElementById('userName').textContent = profile.nombre;
      tenantId = sessionStorage.getItem('tenant_id');

      // Cargar productos para verificar dependencias
      await loadProductos();
      await loadCategorias();

      lucide.createIcons();
    }

    async function loadProductos() {
      const { data } = await supabaseClient
        .from('productos')
        .select('categoria_id')
        .eq('tenant_id', tenantId);

      productos = data || [];
    }

    async function loadCategorias() {
      const { data, error } = await supabaseClient
        .from('categorias')
        .select('*')
        .eq('tenant_id', tenantId)
        .order('orden');

      if (error) {
        console.error('Error cargando categorías:', error);
        return;
      }

      categorias = data || [];
      renderCategorias();
    }

    function renderCategorias() {
      const container = document.getElementById('categoriasGrid');
      const emptyState = document.getElementById('emptyState');

      if (categorias.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      container.innerHTML = categorias.map(cat => {
        const productosEnCat = productos.filter(p => p.categoria_id === cat.id).length;
        const tieneProductos = productosEnCat > 0;

        return `
          <div class="card p-6 ${!cat.activa ? 'opacity-50' : ''}">
            <div class="flex items-start justify-between">
              <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-[#1f1f1f] rounded-xl flex items-center justify-center text-3xl">
                  ${cat.emoji || '📁'}
                </div>
                <div>
                  <h3 class="font-semibold text-lg">${cat.nombre}</h3>
                  <p class="text-sm text-[#9ca3af]">${productosEnCat} productos</p>
                  ${!cat.activa ? '<span class="text-xs text-[#ef4444]">Inactiva</span>' : ''}
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="toggleActiva('${cat.id}', ${!cat.activa})" class="p-2 hover:bg-[#1f1f1f] rounded-lg"
                  title="${cat.activa ? 'Desactivar' : 'Activar'}">
                  <i data-lucide="${cat.activa ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>
                </button>
                <button onclick="editCategoria('${cat.id}')" class="p-2 hover:bg-[#1f1f1f] rounded-lg">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button onclick="confirmDelete('${cat.id}', ${tieneProductos})"
                  class="p-2 hover:bg-[#ef4444]/20 rounded-lg ${tieneProductos ? 'opacity-50 cursor-not-allowed' : ''}"
                  ${tieneProductos ? 'disabled title="Tiene productos"' : ''}>
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Toggle activa
    window.toggleActiva = async function(id, activa) {
      const { error } = await supabaseClient
        .from('categorias')
        .update({ activa })
        .eq('id', id)
        .eq('tenant_id', tenantId);

      if (error) {
        showToast('Error al actualizar', 'error');
        return;
      }

      await loadCategorias();
      showToast(activa ? 'Categoría activada' : 'Categoría desactivada');
    };

    // Modal functions
    function openModal(categoria = null) {
      editingId = categoria?.id || null;

      document.getElementById('modalTitle').textContent = categoria ? 'Editar Categoría' : 'Nueva Categoría';
      document.getElementById('saveBtnText').textContent = categoria ? 'Actualizar' : 'Guardar';

      document.getElementById('categoriaForm').reset();

      if (categoria) {
        document.getElementById('catName').value = categoria.nombre;
        document.getElementById('catEmoji').value = categoria.emoji || '';
        document.getElementById('catOrder').value = categoria.orden || 0;
        document.getElementById('catActive').checked = categoria.activa;
      }

      document.getElementById('categoriaModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('categoriaModal').classList.add('hidden');
      editingId = null;
    }

    // Event listeners
    document.getElementById('addBtn').addEventListener('click', () => openModal());
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    // Guardar
    document.getElementById('categoriaForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('catName').value;
      const emoji = document.getElementById('catEmoji').value;
      const orden = parseInt(document.getElementById('catOrder').value) || 0;
      const activa = document.getElementById('catActive').checked;

      document.getElementById('saveBtn').disabled = true;
      document.getElementById('saveBtnText').textContent = 'Guardando...';

      try {
        const categoriaData = {
          tenant_id: tenantId,
          nombre,
          emoji,
          orden,
          activa
        };

        if (editingId) {
          const { error } = await supabaseClient
            .from('categorias')
            .update(categoriaData)
            .eq('id', editingId)
            .eq('tenant_id', tenantId);

          if (error) throw error;
          showToast('Categoría actualizada');
        } else {
          const { error } = await supabaseClient
            .from('categorias')
            .insert(categoriaData);

          if (error) throw error;
          showToast('Categoría creada');
        }

        closeModal();
        await loadCategorias();
      } catch (error) {
        console.error('Error:', error);
        showToast('Error al guardar', 'error');
      } finally {
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtnText').textContent = editingId ? 'Actualizar' : 'Guardar';
      }
    });

    // Editar
    window.editCategoria = function(id) {
      const categoria = categorias.find(c => c.id === id);
      if (categoria) openModal(categoria);
    };

    // Eliminar
    window.confirmDelete = function(id, tieneProductos) {
      if (tieneProductos) {
        showToast('No puedes eliminar una categoría con productos', 'error');
        return;
      }
      deletingId = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    };

    document.getElementById('cancelDelete').addEventListener('click', () => {
      deletingId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    });

    document.getElementById('deleteModalOverlay').addEventListener('click', () => {
      deletingId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    });

    document.getElementById('confirmDelete').addEventListener('click', async () => {
      if (!deletingId) return;

      const { error } = await supabaseClient
        .from('categorias')
        .delete()
        .eq('id', deletingId)
        .eq('tenant_id', tenantId);

      if (error) {
        showToast('Error al eliminar', 'error');
        return;
      }

      showToast('Categoría eliminada');
      deletingId = null;
      document.getElementById('deleteModal').classList.add('hidden');
      await loadCategorias();
    });

    // Toast
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');

      toastMessage.textContent = message;
      toast.className = `fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg transform transition-all duration-300 z-[300] flex items-center gap-2 ${
        type === 'success' ? 'bg-[#22c55e] text-white' : 'bg-[#ef4444] text-white'
      }`;

      toast.classList.remove('translate-y-20', 'opacity-0');

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', window.auth.logout);

    // Iniciar
    init();
  </script>
</body>
</html>
