<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentas Bancarias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-[#0a0a0a] text-[#f5f5f5] font-body min-h-screen">
  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-[#141414]/95 backdrop-blur border-b border-[#2a2a2a]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="#" id="backLink" class="flex items-center gap-2 text-[#9ca3af] hover:text-white transition-colors">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
          <span>Volver al menú</span>
        </a>
        <div class="flex items-center gap-3">
          <img data-tenant="logo" src="" alt="Logo" class="h-8 w-8 object-contain hidden rounded-lg">
          <h1 data-tenant="nombre" class="font-display text-lg">Cargando...</h1>
        </div>
      </div>
    </div>
  </nav>

  <!-- Contenido -->
  <main class="max-w-3xl mx-auto px-4 py-12">
    <div class="text-center mb-10">
      <div class="w-16 h-16 bg-[#f97316]/20 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="building-2" class="w-8 h-8 text-[#f97316]"></i>
      </div>
      <h1 class="font-display text-4xl mb-2">Cuentas Bancarias</h1>
      <p data-tenant="nombre" class="text-[#9ca3af]">...</p>
    </div>

    <!-- Lista de cuentas -->
    <div id="cuentasList" class="space-y-4">
      <!-- Skeleton loading -->
      <div class="skeleton h-32 rounded-xl"></div>
      <div class="skeleton h-32 rounded-xl"></div>
    </div>

    <!-- Estado vacío -->
    <div id="emptyState" class="hidden text-center py-12">
      <i data-lucide="building-2" class="w-16 h-16 mx-auto text-[#2a2a2a] mb-4"></i>
      <p class="text-[#9ca3af]">No hay cuentas bancarias registradas</p>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-[#22c55e] text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span>¡Copiado al portapapeles!</span>
  </div>

  <!-- Footer -->
  <footer class="text-center py-8 text-[#9ca3af] text-sm">
    <p>Hecho con ❤️ en <span class="text-[#f97316]">Fast Orden</span></p>
  </footer>

  <!-- Scripts -->
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/tenant-theme.js"></script>
  <script>
    const window.supabaseClient = window.window.supabaseClient;
    lucide.createIcons();

    let currentTenant = null;
    let cuentas = [];

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('tenant');

      if (!slug) {
        document.body.innerHTML = `
          <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
              <i data-lucide="alert-triangle" class="w-16 h-16 mx-auto text-[#facc15] mb-4"></i>
              <h1 class="font-display text-3xl mb-2">URL Inválida</h1>
              <p class="text-[#9ca3af]">Se requiere el parámetro ?tenant=slug</p>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // Configurar link de vuelta
      document.getElementById('backLink').href = `/menu.html?tenant=${slug}`;

      // Cargar tenant
      currentTenant = await window.tenantTheme.loadTenantBySlug(slug);
      if (!currentTenant) {
        document.body.innerHTML = `
          <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
              <i data-lucide="store" class="w-16 h-16 mx-auto text-[#9ca3af] mb-4"></i>
              <h1 class="font-display text-3xl mb-2">Negocio No Encontrado</h1>
              <p class="text-[#9ca3af]">El negocio solicitado no existe o está inactivo</p>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // Aplicar tema
      window.tenantTheme.applyTenantTheme(currentTenant);

      // Cargar cuentas
      await loadCuentas();
    }

    async function loadCuentas() {
      const { data, error } = await window.supabaseClient
        .from('cuentas_bancarias')
        .select('*')
        .eq('tenant_id', currentTenant.id)
        .eq('activa', true)
        .order('orden');

      if (error) {
        console.error('Error cargando cuentas:', error);
        return;
      }

      cuentas = data || [];
      renderCuentas();
    }

    function renderCuentas() {
      const container = document.getElementById('cuentasList');
      const emptyState = document.getElementById('emptyState');

      if (cuentas.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = cuentas.map(cuenta => `
        <div class="bg-[#141414] border border-[#2a2a2a] rounded-xl p-6 hover:border-[#f97316] transition-colors">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 bg-[#f97316]/20 rounded-lg flex items-center justify-center">
                  <i data-lucide="building-2" class="w-5 h-5 text-[#f97316]"></i>
                </div>
                <div>
                  <h3 class="font-semibold text-lg">${cuenta.banco}</h3>
                  ${cuenta.tipo_cuenta ? `<span class="text-xs text-[#9ca3af] bg-[#1f1f1f] px-2 py-1 rounded">${cuenta.tipo_cuenta}</span>` : ''}
                </div>
              </div>
              <div class="space-y-1 mt-3">
                <p class="text-2xl font-display tracking-wider text-white">${cuenta.numero}</p>
                <p class="text-[#9ca3af]">Titular: ${cuenta.titular}</p>
              </div>
            </div>
            <button onclick="copyToClipboard('${cuenta.numero}', '${cuenta.banco}')" class="btn btn-secondary btn-sm flex-shrink-0" title="Copiar número de cuenta">
              <i data-lucide="copy" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    window.copyToClipboard = function(numero, banco) {
      navigator.clipboard.writeText(numero).then(() => {
        showToast(`Cuenta de ${banco} copiada`);
      }).catch(err => {
        console.error('Error copiando:', err);
        // Fallback para móviles
        const textArea = document.createElement('textarea');
        textArea.value = numero;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showToast(`Cuenta de ${banco} copiada`);
      });
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.querySelector('span').textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Iniciar
    init();
  </script>
</body>
</html>
