<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina | Fast Orden Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    body {
      overflow: hidden;
    }
    .orden-card {
      transition: all 0.3s ease;
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .tiempo-normal { color: #22c55e; }
    .tiempo-alerta { color: #f59e0b; }
    .tiempo-urgente { color: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .nota-especial {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
      border: 1px solid rgba(245, 158, 11, 0.5);
    }
    .fullscreen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem;
      height: calc(100vh - 100px);
      overflow-y: auto;
    }
    .numero-orden {
      font-size: 3rem;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="bg-[#0a0a0a] text-[#f5f5f5] font-body">
  <!-- Header -->
  <header class="bg-[#141414] border-b border-[#2a2a2a] px-6 py-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-red-600 rounded-xl flex items-center justify-center">
          <i data-lucide="flame" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h1 data-tenant="nombre" class="font-display text-3xl">Cargando...</h1>
          <p class="text-sm text-[#9ca3af]">Pantalla de Cocina</p>
        </div>
      </div>
      <div class="flex items-center gap-6">
        <div class="text-right">
          <p class="text-sm text-[#9ca3af]">Pedidos en preparación</p>
          <p id="countPreparacion" class="font-display text-4xl text-[#3b82f6]">0</p>
        </div>
        <div id="reloj" class="text-2xl font-display text-[#9ca3af]">00:00</div>
      </div>
    </div>
  </header>

  <!-- Grid de Ordenes -->
  <main id="ordenesGrid" class="fullscreen-grid">
    <!-- Ordenes se cargan dinámicamente -->
    <div class="col-span-full flex items-center justify-center text-[#9ca3af]">
      <i data-lucide="utensils" class="w-16 h-16 mb-4 opacity-30"></i>
      <p class="text-xl">Esperando órdenes...</p>
    </div>
  </main>

  <!-- Alerta de plan -->
  <div id="planAlert" class="fixed inset-0 bg-[#0a0a0a] z-50 hidden flex items-center justify-center">
    <div class="text-center p-8">
      <i data-lucide="alert-circle" class="w-16 h-16 mx-auto mb-4 text-[#ef4444]"></i>
      <h2 class="font-display text-3xl mb-2">Acceso Restringido</h2>
      <p class="text-[#9ca3af] mb-6">La pantalla de cocina requiere el plan Pro.</p>
    </div>
  </div>

  <script src="assets/js/supabase.js"></script>
  <script>
    // Usar window.supabaseClient directamente
    lucide.createIcons();

    let currentTenant = null;
    let tenantId = null;
    let ordenes = [];
    let channel = null;

    // Reloj
    function actualizarReloj() {
      const now = new Date();
      document.getElementById('reloj').textContent = now.toLocaleTimeString('es-ES', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    async function init() {
      // Obtener tenant del slug
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('tenant');

      if (!slug) {
        document.body.innerHTML = `
          <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
              <i data-lucide="alert-triangle" class="w-16 h-16 mx-auto mb-4 text-[#f59e0b]"></i>
              <h1 class="font-display text-3xl mb-2">URL Inválida</h1>
              <p class="text-[#9ca3af]">Se requiere el parámetro ?tenant=slug</p>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // Cargar tenant
      const { data: tenant, error } = await supabaseClient
        .from('tenants')
        .select('*')
        .eq('slug', slug)
        .eq('activo', true)
        .single();

      if (error || !tenant) {
        document.body.innerHTML = `
          <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
              <i data-lucide="store" class="w-16 h-16 mx-auto mb-4 text-[#9ca3af]"></i>
              <h1 class="font-display text-3xl mb-2">Negocio No Encontrado</h1>
              <p class="text-[#9ca3af]">El menú solicitado no existe o está inactivo</p>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      currentTenant = tenant;
      tenantId = tenant.id;

      // Verificar plan Pro
      if (tenant.plan !== 'pro') {
        document.getElementById('planAlert').classList.remove('hidden');
        return;
      }

      document.querySelector('[data-tenant="nombre"]').textContent = tenant.nombre;

      // Cargar ordenes
      await cargarOrdenes();

      // Suscribirse a cambios
      suscribirRealtime();

      // Actualizar cada minuto para tiempos
      setInterval(renderOrdenes, 60000);

      lucide.createIcons();
    }

    async function cargarOrdenes() {
      const hoy = new Date().toISOString().split('T')[0];

      const { data, error } = await supabaseClient
        .from('pedidos')
        .select('*, items_pedido(*)')
        .eq('tenant_id', tenantId)
        .eq('estado', 'en_preparacion')
        .gte('created_at', hoy)
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Error cargando órdenes:', error);
        return;
      }

      ordenes = data || [];
      renderOrdenes();
    }

    function renderOrdenes() {
      const grid = document.getElementById('ordenesGrid');

      if (ordenes.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center text-[#9ca3af]">
            <i data-lucide="utensils" class="w-24 h-24 mb-6 opacity-20"></i>
            <p class="text-2xl opacity-60">Esperando órdenes...</p>
            <p class="text-sm mt-2 opacity-40">Las órdenes aparecerán aquí automáticamente</p>
          </div>
        `;
        document.getElementById('countPreparacion').textContent = '0';
        lucide.createIcons();
        return;
      }

      document.getElementById('countPreparacion').textContent = ordenes.length;

      grid.innerHTML = ordenes.map(orden => {
        const items = orden.items_pedido || [];
        const tiempoTranscurrido = calcularTiempo(orden.created_at);
        const tiempoClass = tiempoTranscurrido.minutos > 15 ? 'tiempo-urgente' :
                             tiempoTranscurrido.minutos > 10 ? 'tiempo-alerta' : 'tiempo-normal';

        // Items con notas especiales
        const itemsConNotas = items.filter(i => i.notas && i.notas.length > 0);

        return `
          <div class="orden-card bg-[#1a1a1a] border-2 border-[#3b82f6] rounded-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-900/30 to-blue-600/20 px-6 py-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                  <span class="numero-orden font-display">#${orden.numero_dia}</span>
                  ${orden.tipo === 'delivery' ?
                    '<span class="bg-blue-500/30 text-blue-400 px-3 py-1 rounded-full text-sm font-semibold">DELIVERY</span>' :
                    '<span class="bg-green-500/30 text-green-400 px-3 py-1 rounded-full text-sm font-semibold">LOCAL</span>'
                  }
                </div>
                <div class="text-right">
                  <span class="text-3xl font-display ${tiempoClass}">${tiempoTranscurrido.texto}</span>
                </div>
              </div>
            </div>

            <!-- Items -->
            <div class="p-6">
              <div class="space-y-3">
                ${items.map(item => `
                  <div class="flex items-start justify-between py-2 border-b border-[#2a2a2a] last:border-0">
                    <div class="flex-1">
                      <div class="flex items-baseline gap-2">
                        <span class="text-2xl font-display text-[#f97316]">${item.cantidad}x</span>
                        <span class="text-xl font-semibold">${item.nombre}</span>
                      </div>
                      ${item.notas?.length ? `
                        <div class="mt-2 nota-especial rounded-lg px-3 py-2">
                          <div class="flex items-center gap-2">
                            <i data-lucide="alert-triangle" class="w-4 h-4 text-[#facc15]"></i>
                            <span class="text-[#facc15] font-medium text-sm">${item.notas.join(', ')}</span>
                          </div>
                        </div>
                      ` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>

              ${itemsConNotas.length > 0 ? `
                <div class="mt-4 bg-[#f59e0b]/10 border border-[#f59e0b]/30 rounded-xl p-3">
                  <div class="flex items-center gap-2 text-[#f59e0b]">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                    <span class="font-semibold">¡ATENCIÓN: ${itemsConNotas.length} item(s) con notas especiales!</span>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Footer -->
            <div class="bg-[#141414] px-6 py-3 flex items-center justify-between">
              <span class="text-[#9ca3af] text-sm">${new Date(orden.created_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}</span>
              <span class="text-lg font-display">${currentTenant?.moneda || 'RD$'}${orden.total.toFixed(2)}</span>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function calcularTiempo(fecha) {
      const diff = Date.now() - new Date(fecha).getTime();
      const minutos = Math.floor(diff / 60000);

      if (minutos < 60) {
        return { minutos, texto: `${minutos}m` };
      }
      const horas = Math.floor(minutos / 60);
      return { minutos, texto: `${horas}h ${minutos % 60}m` };
    }

    function suscribirRealtime() {
      channel = supabase
        .channel('cocina-ordenes')
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'pedidos',
          filter: `tenant_id=eq.${tenantId}`
        }, async (payload) => {
          if (payload.eventType === 'INSERT') {
            // Verificar si es en_preparacion
            if (payload.new.estado === 'en_preparacion') {
              // Cargar items del pedido
              const { data: items } = await supabaseClient
                .from('items_pedido')
                .select('*')
                .eq('pedido_id', payload.new.id);

              payload.new.items_pedido = items || [];
              ordenes.push(payload.new);
              renderOrdenes();
            }
          } else if (payload.eventType === 'UPDATE') {
            if (payload.new.estado === 'en_preparacion') {
              // Actualizar o agregar
              const index = ordenes.findIndex(o => o.id === payload.new.id);
              if (index === -1) {
                // Cargar items
                const { data: items } = await supabaseClient
                  .from('items_pedido')
                  .select('*')
                  .eq('pedido_id', payload.new.id);
                payload.new.items_pedido = items || [];
                ordenes.push(payload.new);
              } else {
                ordenes[index] = { ...ordenes[index], ...payload.new };
              }
            } else {
              // Quitar de la lista
              ordenes = ordenes.filter(o => o.id !== payload.new.id);
            }
            renderOrdenes();
          }
        })
        .subscribe();
    }

    // Iniciar
    init();
  </script>
</body>
</html>
