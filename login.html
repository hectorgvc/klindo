<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klindo — Inicia Sesión</title>
  <meta name="description" content="Accede al panel de administración de Klindo, el sistema de gestión para lavanderías." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 40%, #ecfeff 100%);
      padding: 20px;
    }

    .login-wrapper {
      display: flex;
      width: 100%;
      max-width: 900px;
      min-height: 520px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-xl);
    }

    /* Panel izquierdo — decorativo */
    .login-hero {
      flex: 1;
      background: linear-gradient(145deg, var(--brand-600) 0%, var(--cyan-500) 50%, var(--teal-500) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 36px;
      gap: 24px;
      position: relative;
      overflow: hidden;
    }

    .login-hero::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      background: rgba(255,255,255,.08);
      border-radius: 50%;
      top: -80px; right: -80px;
    }

    .login-hero::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      background: rgba(255,255,255,.06);
      border-radius: 50%;
      bottom: -60px; left: -60px;
    }

    .hero-icon {
      width: 80px; height: 80px;
      background: rgba(255,255,255,.2);
      border-radius: var(--radius-xl);
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px);
    }

    .hero-icon svg { width: 44px; height: 44px; color: white; }

    .hero-title {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: white;
      text-align: center;
      line-height: 1.2;
    }

    .hero-subtitle {
      color: rgba(255,255,255,.8);
      text-align: center;
      font-size: .92rem;
      line-height: 1.6;
    }

    .hero-features {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .hero-feat {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,.9);
      font-size: .85rem;
      font-weight: 600;
    }

    .hero-feat-dot {
      width: 8px; height: 8px;
      background: rgba(255,255,255,.7);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Panel derecho — formulario */
    .login-form-panel {
      width: 400px;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 40px;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .login-brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--brand-500), var(--cyan-500));
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
    }

    .login-brand-icon svg { width: 22px; height: 22px; color: white; }

    .login-brand-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--text-primary);
    }

    .login-brand-name span { color: var(--brand-500); }

    .login-welcome {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .login-desc {
      font-size: .88rem;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .login-form { display: flex; flex-direction: column; gap: 20px; }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon .form-control {
      padding-left: 42px;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .input-icon svg { width: 18px; height: 18px; }

    .forgot-link {
      text-align: right;
      margin-top: -8px;
      font-size: .82rem;
      color: var(--brand-600);
      font-weight: 600;
    }

    .btn-login {
      background: linear-gradient(135deg, var(--brand-500), var(--cyan-500));
      color: white;
      padding: 13px 24px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: .95rem;
      border: none;
      width: 100%;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 4px 14px rgba(14,165,233,.35);
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(14,165,233,.4);
    }

    .btn-login:disabled {
      opacity: .6;
      transform: none;
    }

    .error-msg {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: .85rem;
      font-weight: 600;
      display: none;
    }

    .error-msg.show { display: block; }

    @media (max-width: 768px) {
      .login-wrapper { flex-direction: column; max-width: 420px; }
      .login-hero { display: none; }
      .login-form-panel { width: 100%; padding: 36px 28px; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">

    <!-- Hero panel -->
    <div class="login-hero">
      <div class="hero-icon">
        <i data-lucide="droplets" style="width:44px;height:44px;color:white;"></i>
      </div>

      <div>
        <div class="hero-title">Klindo</div>
        <div class="hero-subtitle">Sistema de gestión para<br/>lavanderías y tintorerías</div>
      </div>

      <div class="hero-features">
        <div class="hero-feat"><span class="hero-feat-dot"></span>Registro de prendas en segundos</div>
        <div class="hero-feat"><span class="hero-feat-dot"></span>Seguimiento por estado en tiempo real</div>
        <div class="hero-feat"><span class="hero-feat-dot"></span>Módulo de delivery opcional</div>
        <div class="hero-feat"><span class="hero-feat-dot"></span>Vista de planta para operaciones</div>
        <div class="hero-feat"><span class="hero-feat-dot"></span>Dashboard con estadísticas</div>
      </div>
    </div>

    <!-- Form panel -->
    <div class="login-form-panel">

      <div class="login-brand">
        <div class="login-brand-icon">
          <i data-lucide="droplets" style="width:28px;height:28px;color:white;"></i>
        </div>
        <div class="login-brand-name">Klin<span>do</span></div>
      </div>

      <h1 class="login-welcome">Bienvenido de vuelta</h1>
      <p class="login-desc">Ingresa tus credenciales para acceder al panel</p>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <i data-lucide="mail" style="width:18px;height:18px;"></i>
            </span>
            <input id="email" name="email" type="email" class="form-control" placeholder="admin@milavanderia.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <i data-lucide="lock" style="width:18px;height:18px;"></i>
            </span>
            <input id="password" name="password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
          </div>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <button type="submit" id="btnLogin" class="btn-login">
          <span id="btnLoginText">Iniciar sesión</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Inicializar Lucide icons
    lucide.createIcons();

    // Cargar logo del tenant si está disponible
    async function loadTenantLogo() {
      // Intentar obtener tenant del localStorage (sesión anterior)
      const lastTenantSlug = localStorage.getItem('last_tenant_slug');
      const lastTenantId = localStorage.getItem('tenant_id');

      // O buscar en URL: ?tenant=slug
      const urlParams = new URLSearchParams(window.location.search);
      const tenantSlugFromUrl = urlParams.get('tenant');

      const tenantIdentifier = tenantSlugFromUrl || lastTenantSlug || lastTenantId;
      if (!tenantIdentifier) return;

      try {
        // Consultar tenant por slug o id
        let query = window.supabaseClient.from('tenants').select('logo_url, nombre');
        if (tenantSlugFromUrl || lastTenantSlug) {
          query = query.eq('slug', tenantSlugFromUrl || lastTenantSlug);
        } else {
          query = query.eq('id', lastTenantId);
        }
        const { data: tenant, error } = await query.maybeSingle();

        if (error || !tenant || !tenant.logo_url) return;

        // Reemplazar el logo en el formulario
        const brandIcon = document.querySelector('.login-brand-icon');
        const brandName = document.querySelector('.login-brand-name');

        if (brandIcon) {
          brandIcon.innerHTML = `<img src="${tenant.logo_url}" style="width:100%; height:100%; object-fit:contain; border-radius:var(--radius-md); background:white; padding:2px;">`;
        }
        if (brandName) {
          brandName.textContent = tenant.nombre || 'Mi Lavandería';
          brandName.innerHTML = brandName.textContent; // eliminar el span coloreado
        }
      } catch (err) {
        console.log('No se pudo cargar el logo del tenant:', err);
      }
    }

    // Cargar logo al iniciar
    loadTenantLogo();

    async function handleLogin(e) {
      e.preventDefault();

      const btn       = document.getElementById('btnLogin');
      const btnText   = document.getElementById('btnLoginText');
      const errorMsg  = document.getElementById('errorMsg');
      const email     = document.getElementById('email').value.trim();
      const password  = document.getElementById('password').value;

      // Feedback visual
      btn.disabled = true;
      btnText.textContent = 'Ingresando…';
      errorMsg.classList.remove('show');

      const result = await window.auth.login(email, password);

      if (!result.success) {
        errorMsg.textContent = result.error || 'Credenciales incorrectas. Intenta de nuevo.';
        errorMsg.classList.add('show');
        btn.disabled = false;
        btnText.textContent = 'Iniciar sesión';
      }
      // Si es exitoso, auth.js redirige automáticamente
    }

    // Auto-focus
    document.getElementById('email').focus();
  </script>

</body>
</html>
